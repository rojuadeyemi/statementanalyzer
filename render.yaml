# Render Blueprint — commit this, then New > Blueprint in the Render dashboard.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: statement-analyzer
    runtime: python
    plan: free          # free spins down after ~15 min idle; a cold PDF parse is slow
    region: frankfurt      # oregon/ohio also fine
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STATEMENT_ENABLE_LLM
        value: "0
